<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Accessible Semantic HTML5 Enterprise Dashboard">

    <title>Accessible Enterprise Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background: #f4f6f8;
            color: #222;
        }

        a {
            color: #0645ad;
            font-weight: bold;
        }

        a:focus,
        button:focus,
        input:focus,
        select:focus,
        textarea:focus {
            outline: 3px solid #ff9800;
            outline-offset: 3px;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0 0 15px;
        }

        header nav a {
            color: white;
            margin-right: 20px;
            text-decoration: none;
        }

        header nav a:hover,
        header nav a:focus {
            text-decoration: underline;
        }

        .layout {
            display: grid;
            grid-template-columns: 230px 1fr;
            gap: 25px;
            max-width: 1200px;
            margin: auto;
            padding: 25px;
        }

        aside {
            background: white;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            height: fit-content;
        }

        aside h2 {
            margin-top: 0;
        }

        aside ul {
            list-style: none;
            padding: 0;
        }

        aside li {
            margin: 15px 0;
        }

        main {
            min-width: 0;
        }

        section {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        section h2 {
            margin-top: 0;
            color: #172554;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        article {
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            padding: 20px;
            border-radius: 8px;
        }

        article h3 {
            margin-top: 0;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            margin: 5px 0;
            color: #172554;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        caption {
            text-align: left;
            font-weight: bold;
            margin-bottom: 10px;
        }

        th,
        td {
            border: 1px solid #777;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #e5e7eb;
        }

        fieldset {
            border: 1px solid #777;
            padding: 20px;
            border-radius: 6px;
        }

        legend {
            font-weight: bold;
            padding: 0 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input,
        select,
        textarea {
            width:100%;}
